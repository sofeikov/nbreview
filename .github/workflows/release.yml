# Publishes the extension to the Visual Studio Marketplace when a v* tag is pushed.
# Authentication is Marketplace trusted publishing (OIDC): there is no token to steal.
# The Marketplace policy "nbreview release" only accepts this workflow file, running
# in the `marketplace` environment, which only deploys from v* tags and needs the
# maintainer's approval. Keep the file name and the environment name in step with it.
name: release

on:
  push:
    tags: ['v*']

# Nothing is writable by default; only the publish job gets id-token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can point anywhere, so refuse one whose commit isn't on main, and one
      # that doesn't match the version in package.json.
      - name: Check the tag
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: nbreview.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
    steps:
      # Only the built file is used here; this job runs none of the repository's code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      # --oidc needs vsce 4.1.0 or newer.
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath nbreview.vsix
